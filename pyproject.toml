[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cellshape3d"
version = "0.1.0"
description = "Cell and nucleus shape (aspect ratio, orientation, fibre alignment) from 3D confocal z-stack TIFFs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "pandas>=2.0",
    "tifffile>=2023.7",
    "matplotlib>=3.7",
    "statsmodels>=0.14",
    "pillow>=9",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
stardist = ["stardist>=0.9", "tensorflow>=2.12"]
docx = ["python-docx>=1.1"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.5", "python-docx>=1.1"]

[project.scripts]
cellshape3d = "cellshape3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: end-to-end pipeline tests on synthetic stacks"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "NPY"]
ignore = ["E501", "E701", "E702", "E731", "E741", "B023", "B905"]
